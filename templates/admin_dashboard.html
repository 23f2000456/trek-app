<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">Trekkers Admin</span>
    <div>
        <a href="/admin/search" class="btn btn-outline-light btn-sm me-2">Search</a>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>
<div class="container mt-4">
    <h4>Welcome, {{ current_user.name }}</h4>
    <div class="row mt-4">
        <div class="col-md-3">
            <div class="card text-white bg-primary mb-3">
                <div class="card-body">
                    <h5>Total Treks</h5>
                    <p class="fs-3">{{ total_treks }}</p>
                    <a href="/admin/treks" class="btn btn-light btn-sm">Manage</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-success mb-3">
                <div class="card-body">
                    <h5>Total Users</h5>
                    <p class="fs-3">{{ total_users }}</p>
                    <a href="/admin/users" class="btn btn-light btn-sm">Manage</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-warning mb-3">
                <div class="card-body">
                    <h5>Total Staff</h5>
                    <p class="fs-3">{{ total_staff }}</p>
                    <a href="/admin/staff" class="btn btn-light btn-sm">Manage</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-danger mb-3">
                <div class="card-body">
                    <h5>Total Bookings</h5>
                    <p class="fs-3">{{ total_bookings }}</p>
                    <a href="/admin/bookings" class="btn btn-light btn-sm">View</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
