<!DOCTYPE html>
<html>
<head>
    <title>Add Trek</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">Admin Panel</span>
    <a href="/admin/treks" class="btn btn-outline-light btn-sm">Back to Treks</a>
</nav>
<div class="container mt-4" style="max-width:600px">
    <h4>Add New Trek</h4>
    <form method="POST">
        <div class="mb-3">
            <input type="text" name="name" class="form-control" placeholder="Trek Name" required>
        </div>
        <div class="mb-3">
            <input type="text" name="location" class="form-control" placeholder="Location" required>
        </div>
        <div class="mb-3">
            <select name="difficulty" class="form-select" required>
                <option value="">Select Difficulty</option>
                <option value="Easy">Easy</option>
                <option value="Moderate">Moderate</option>
                <option value="Hard">Hard</option>
            </select>
        </div>
        <div class="mb-3">
            <input type="text" name="duration" class="form-control" placeholder="Duration (days)" required>
        </div>
        <div class="mb-3">
            <input type="number" name="total_slots" class="form-control" placeholder="Total Slots" required>
        </div>
        <div class="mb-3">
            <input type="date" name="start_date" class="form-control" required>
        </div>
        <div class="mb-3">
            <input type="date" name="end_date" class="form-control" required>
        </div>
        <div class="mb-3">
            <select name="status" class="form-select" required>
                <option value="Pending">Pending</option>
                <option value="Approved">Approved</option>
                <option value="Open">Open</option>
                <option value="Closed">Closed</option>
                <option value="Completed">Completed</option>
            </select>
        </div>
        <div class="mb-3">
            <input type="number" step="0.01" name="price" class="form-control" placeholder="Price" required>
        </div>
        <div class="mb-3">
            <select name="assigned_staffid" class="form-select">
                <option value="">Assign Staff (optional)</option>
                {% for staff in staff_list %}
                <option value="{{ staff.id }}">{{ staff.name }} (ID: {{ staff.id }})</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-success w-100">Add Trek</button>
    </form>
</div>
</body>
</html>
