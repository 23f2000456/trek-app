<!DOCTYPE html>
<html>
<head>
    <title>Edit Trek</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">Admin Panel</span>
    <a href="/admin/treks" class="btn btn-outline-light btn-sm">Back to Treks</a>
</nav>
<div class="container mt-4" style="max-width:600px">
    <h4>Edit Trek</h4>
    <form method="POST">
        <div class="mb-3">
            <input type="text" name="name" class="form-control" value="{{ trek.name }}" required>
        </div>
        <div class="mb-3">
            <input type="text" name="location" class="form-control" value="{{ trek.location }}" required>
        </div>
        <div class="mb-3">
            <select name="difficulty" class="form-select">
                <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
                <option value="Hard" {% if trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
            </select>
        </div>
        <div class="mb-3">
            <input type="text" name="duration" class="form-control" value="{{ trek.duration }}" required>
        </div>
       <div class="mb-3">
    <label>Total Slots</label>
    <input type="number" name="total_slots" class="form-control" value="{{ trek.total_slots }}" required>
</div>
<div class="mb-3">
    <label>Available Slots</label>
    <input type="number" name="available_slots" class="form-control" value="{{ trek.available_slots }}" required>
</div>
        <div class="mb-3">
            <input type="date" name="start_date" class="form-control" value="{{ trek.start_date }}" required>
        </div>
        <div class="mb-3">
            <input type="date" name="end_date" class="form-control" value="{{ trek.end_date }}" required>
        </div>
        <div class="mb-3">
            <select name="status" class="form-select">
                <option value="Pending" {% if trek.status == 'Pending' %}selected{% endif %}>Pending</option>
                <option value="Approved" {% if trek.status == 'Approved' %}selected{% endif %}>Approved</option>
                <option value="Open" {% if trek.status == 'Open' %}selected{% endif %}>Open</option>
                <option value="Closed" {% if trek.status == 'Closed' %}selected{% endif %}>Closed</option>
                <option value="Completed" {% if trek.status == 'Completed' %}selected{% endif %}>Completed</option>
            </select>
        </div>
        <div class="mb-3">
            <input type="number" step="0.01" name="price" class="form-control" value="{{ trek.price }}" required>
        </div>
        <div class="mb-3">
            <select name="assigned_staffid" class="form-select">
                <option value="">No Staff Assigned</option>
                {% for staff in staff_list %}
                <option value="{{ staff.id }}" {% if trek.assigned_staffid == staff.id %}selected{% endif %}>
                    {{ staff.name }} (ID: {{ staff.id }})
                </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Update Trek</button>
    </form>
</div>
</body>
</html>
