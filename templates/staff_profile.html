<!DOCTYPE html>
<html>
<head>
    <title>Staff Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">Staff Panel</span>
    <div>
        <a href="/staff/dashboard" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>
<div class="container mt-4" style="max-width: 500px">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-success">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <h4>My Profile</h4>
    <form method="POST">
        <div class="mb-3">
            <label>Name</label>
            <input type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
        </div>
        <div class="mb-3">
            <label>Contact Number</label>
            <input type="text" name="contact" class="form-control" 
                value="{{ profile.contact if profile else '' }}">
        </div>
        <div class="mb-3">
            <label>Role</label>
            <input type="text" class="form-control" value="{{ current_user.role }}" disabled>
        </div>
        <button type="submit" class="btn btn-primary w-100">Update Profile</button>
    </form>
</div>
</body>
</html>
